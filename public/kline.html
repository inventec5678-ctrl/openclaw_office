  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: #00d9ff;
    }
    .chart-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .chart-wrapper {
      position: relative;
      height: 400px;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;

    .symbol-info {
      text-align: center;
      margin-bottom: 20px;
    }
    .symbol-info h2 {
      font-size: 2rem;
      margin-bottom: 5px;
    }
    .price {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .price.up { color: #4ade80; }

    }

</head>
<body>
  <div class="container">
    <h1>📈 K線圖表 (MA + KD + RSI + 布林帶 + Williams %R + DMI)</h1>
    
    <div class="symbol-info">
      <h2 id="stockName">台積電 (2330)</h2>
      <span id="currentPrice" class="price up">1,050.00</span>
      <span id="priceChange" class="change">+15.00 (+1.45%)</span>
    </div>
    
    <div class="controls">
      <button onclick="changeTimeframe('1D')" class="active">日K</button>
      <button onclick="changeTimeframe('1W')">週K</button>

      <button onclick="randomizeData()">🔄 重新整理數據</button>

    <div class="chart-container">

        <div class="legend-item"><span class="legend-color" style="background: rgba(156, 163, 175, 0.6); border: 1px dashed #fff;"></span>布林帶</div>
      </div>
    </div>
    
    <div class="chart-container">
      <div class="chart-wrapper" style="height: 180px;">
        <canvas id="kdChart"></canvas>
      </div>
      <div class="indicator-legend">
        <div class="legend-item"><span class="legend-color" style="background: #4ade80;"></span>K值</div>
        <div class="legend-item"><span class="legend-color" style="background: #f87171;"></span>D值</div>
        <div class="legend-item"><span class="legend-color" style="background: rgba(255,255,255,0.3); border: 1px dashed #fff;"></span>超買/超賣</div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-wrapper" style="height: 150px;">

        <div class="legend-item"><span class="legend-color" style="background: #4ade80;"></span>DIF</div>
        <div class="legend-item"><span class="legend-color" style="background: #f87171;"></span>DEA</div>
        <div class="legend-item"><span class="legend-color" style="background: #a78bfa;"></span>MACD柱</div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-wrapper" style="height: 150px;">
        <canvas id="rsiChart"></canvas>
      </div>
      <div class="indicator-legend">
        <div class="legend-item"><span class="legend-color" style="background: #a78bfa;"></span>RSI(14)</div>
        <div class="legend-item"><span class="legend-color" style="background: rgba(255,255,255,0.3); border: 1px dashed #fff;"></span>超買/超賣</div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-wrapper" style="height: 150px;">
        <canvas id="wrChart"></canvas>
      </div>
      <div class="indicator-legend">
        <div class="legend-item"><span class="legend-color" style="background: #f97316;"></span>Williams %R(14)</div>
        <div class="legend-item"><span class="legend-color" style="background: rgba(255,255,255,0.3); border: 1px dashed #fff;"></span>超買/超賣</div>
      </div>
    </div>

    <!-- DMI 指標 -->
    <div class="chart-container">
      <h3 style="text-align: center; margin-bottom: 10px; color: #22d3d1;">DMI 趨向指標</h3>
      <div class="chart-wrapper">
        <canvas id="dmiChart"></canvas>
      </div>
      <div class="indicator-legend">
        <div class="legend-item"><span class="legend-color" style="background: #22d3d1;"></span>+DI(14)</div>
        <div class="legend-item"><span class="legend-color" style="background: #f472c6;"></span>-DI(14)</div>
        <div class="legend-item"><span class="legend-color" style="background: #fbbf24;"></span>ADX(14)</div>
      </div>
    </div>
  </div>

  <script>
    let chart = null;
    let kdChart = null;
    let rsiChart = null;
    let macdChart = null;
    let wrChart = null;
    let dmiChart = null;
    let currentTimeframe = '1D';
    let currentData = [];
    
    // 計算 MA (移動平均線)
    function calculateMA(data, period) {
      const ma = [];
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) {
          ma.push(null);
        } else {
          let sum = 0;
          for (let j = 0; j < period; j++) {
            sum += data[i - j].c;
          }
          ma.push(parseFloat((sum / period).toFixed(2)));
        }
      }
      return ma;
    }
    
    // 計算 KD (隨機指標)
    function calculateKD(data, kPeriod = 9, dPeriod = 3) {
      const kValues = [];
      const dValues = [];
      
      for (let i = 0; i < data.length; i++) {
        if (i < kPeriod - 1) {
          kValues.push(null);
          dValues.push(null);
        } else {
          // 找出過去 K 週期的最高價和最低價
          let high = data[i].h;
          let low = data[i].l;
          for (let j = 1; j < kPeriod; j++) {
            if (data[i - j].h > high) high = data[i - j].h;
            if (data[i - j].l < low) low = data[i - j].l;
          }
          
          const close = data[i].c;
          const rsv = high === low ? 50 : ((close - low) / (high - low)) * 100;
          
          // 計算 K 值 (RSV 的 3 日SMA)
          let k;
          if (kValues.length < 1) {
            k = rsv;
          } else {
            const prevK = kValues[kValues.length - 1];
            k = (prevK * 2 + rsv) / 3;
          }
          
          kValues.push(parseFloat(k.toFixed(2)));
        }
      }
      
      // 計算 D 值 (K 的 3 日SMA)
      for (let i = 0; i < kValues.length; i++) {
        if (i < dPeriod - 1 || kValues[i] === null) {
          dValues.push(null);
        } else {
          let sum = 0;
          let count = 0;
          for (let j = 0; j < dPeriod; j++) {
            if (kValues[i - j] !== null) {
              sum += kValues[i - j];
              count++;
            }
          }
          dValues.push(count > 0 ? parseFloat((sum / count).toFixed(2)) : null);
        }
      }
      
      return { k: kValues, d: dValues };
    }

    // 計算 RSI (相對強弱指標)
    function calculateRSI(data, period = 14) {
      const rsi = [];
      let avgGain = 0;
      let avgLoss = 0;
      
      for (let i = 0; i < data.length; i++) {
        if (i < period) {
          rsi.push(null);
        } else {
          const change = data[i].c - data[i - 1].c;
          const gain = change > 0 ? change : 0;
          const loss = change < 0 ? -change : 0;
          
          if (i === period) {
            // 第一次計算平均漲跌幅
            let sumGain = 0, sumLoss = 0;
            for (let j = 1; j <= period; j++) {
              const c = data[j].c - data[j - 1].c;
              if (c > 0) sumGain += c;
              else sumLoss += -c;
            }
            avgGain = sumGain / period;
            avgLoss = sumLoss / period;
          } else {
            // 後續使用平滑平均
            avgGain = (avgGain * (period - 1) + gain) / period;
            avgLoss = (avgLoss * (period - 1) + loss) / period;
          }
          
          const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
          const rsiValue = 100 - (100 / (1 + rs));
          rsi.push(parseFloat(rsiValue.toFixed(2)));
        }
      }
      
      return rsi;
    }

    // 計算布林帶 (Bollinger Bands)
    function calculateBollingerBands(data, period = 20, stdDev = 2) {
      const middleBand = [];
      const upperBand = [];
      const lowerBand = [];
      
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) {
          middleBand.push(null);
          upperBand.push(null);
          lowerBand.push(null);
        } else {
          // 計算 MA (中間帶)
          let sum = 0;
          for (let j = 0; j < period; j++) {
            sum += data[i - j].c;
          }
          const ma = sum / period;
          middleBand.push(parseFloat(ma.toFixed(2)));
          
          // 計算標準差
          let variance = 0;
          for (let j = 0; j < period; j++) {
            variance += Math.pow(data[i - j].c - ma, 2);
          }
          const std = Math.sqrt(variance / period);
          
          // 計算上下波段
          upperBand.push(parseFloat((ma + stdDev * std).toFixed(2)));
          lowerBand.push(parseFloat((ma - stdDev * std).toFixed(2)));
        }
      }
      
      return {
        middle: middleBand,
        upper: upperBand,
        lower: lowerBand
      };
    }
    
    // 計算 MACD (指數平滑異同移動平均線)
    function calculateMACD(data, fastPeriod = 12, slowPeriod = 26, signalPeriod = 9) {
      const ema = (values, period) => {
        const k = 2 / (period + 1);
        const emaValues = [];
        let prevEma = values[0];
        
        for (let i = 0; i < values.length; i++) {
          if (i === 0) {
            emaValues.push(values[i]);
          } else {
            const emaValue = values[i] * k + prevEma * (1 - k);
            emaValues.push(emaValue);
            prevEma = emaValue;
          }
        }
        return emaValues;
      };
      
      // 提取收盤價
      const closes = data.map(d => d.c);
      
      // 計算快速和慢速 EMA
      const fastEma = ema(closes, fastPeriod);
      const slowEma = ema(closes, slowPeriod);
      
      // 計算 DIF (差離值)
      const dif = [];
      for (let i = 0; i < data.length; i++) {
        dif.push(fastEma[i] - slowEma[i]);
      }
      
      // 計算 DEA (訊號線) - DIF 的 EMA
      const dea = ema(dif, signalPeriod);
      
      // 計算 MACD 柱狀圖 (DIF - DEA) * 2
      const macdBar = [];
      for (let i = 0; i < data.length; i++) {
        const value = (dif[i] - dea[i]) * 2;
        macdBar.push(parseFloat(value.toFixed(2)));
      }
      
      return {
        dif: dif.map(v => parseFloat(v.toFixed(2))),
        dea: dea.map(v => parseFloat(v.toFixed(2))),
        macd: macdBar
      };
    }
    
    // 計算 Williams %R (威廉指標)
    function calculateWilliamsR(data, period = 14) {
      const wr = [];
      
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) {
          wr.push(null);
        } else {
          // 找出過去 period 週期的最高價和最低價
          let high = data[i].h;
          let low = data[i].l;
          for (let j = 1; j < period; j++) {
            if (data[i - j].h > high) high = data[i - j].h;
            if (data[i - j].l < low) low = data[i - j].l;
          }
          
          const close = data[i].c;
          
          // Williams %R = (Highest High - Close) / (Highest High - Lowest Low) * -100
          if (high === low) {
            wr.push(-50);
          } else {
            const wrValue = ((high - close) / (high - low)) * -100;
            wr.push(parseFloat(wrValue.toFixed(2)));
          }
        }
      }
      
      return wr;
    }
    
    // 計算 DMI (趨向指標) + ADX
    function calculateDMI(data, period = 14) {
      const plusDI = [];
      const minusDI = [];
      const adx = [];
      
      // 計算 True Range (TR)
      const tr = [];
      const plusDM = [];
      const minusDM = [];
      
      for (let i = 0; i < data.length; i++) {
        if (i === 0) {
          tr.push(data[i].h - data[i].l);
          plusDM.push(0);
          minusDM.push(0);
        } else {
          // True Range = max(High-Low, |High-PrevClose|, |Low-PrevClose|)
          const highLow = data[i].h - data[i].l;
          const highPrevClose = Math.abs(data[i].h - data[i - 1].c);
          const lowPrevClose = Math.abs(data[i].l - data[i - 1].c);
          tr.push(Math.max(highLow, highPrevClose, lowPrevClose));
          
          // +DM = max(High - PrevHigh, 0)
          const highDiff = data[i].h - data[i - 1].h;
          const prevLowDiff = data[i - 1].l - data[i].l;
          plusDM.push(highDiff > prevLowDiff && highDiff > 0 ? highDiff : 0);
          
          // -DM = max(PrevLow - Low, 0)
          minusDM.push(prevLowDiff > highDiff && prevLowDiff > 0 ? prevLowDiff : 0);
        }
      }
      
      // 計算平滑的 TR, +DM, -DM (使用 Wilder's Smoothing)
      const smoothTR = [];
      const smoothPlusDM = [];
      const smoothMinusDM = [];
      
      // 初始 Sum
      let sumTR = 0, sumPlusDM = 0, sumMinusDM = 0;
      for (let i = 0; i < period; i++) {
        sumTR += tr[i];
        sumPlusDM += plusDM[i];
        sumMinusDM += minusDM[i];
      }
      smoothTR.push(sumTR);
      smoothPlusDM.push(sumPlusDM);
      smoothMinusDM.push(sumMinusDM);
      
      // 平滑後的值
      for (let i = period; i < data.length; i++) {
        const prevTR = smoothTR[smoothTR.length - 1];
        const prevPlusDM = smoothPlusDM[smoothPlusDM.length - 1];
        const prevMinusDM = smoothMinusDM[smoothMinusDM.length - 1];
        
        smoothTR.push(prevTR - (prevTR / period) + tr[i]);
        smoothPlusDM.push(prevPlusDM - (prevPlusDM / period) + plusDM[i]);
        smoothMinusDM.push(prevMinusDM - (prevMinusDM / period) + minusDM[i]);
      }
      
      // 計算 +DI 和 -DI
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) {
          plusDI.push(null);
          minusDI.push(null);
        } else {
          const idx = i - period + 1;
          const trVal = smoothTR[idx];
          if (trVal === 0) {
            plusDI.push(0);
            minusDI.push(0);
          } else {
            const pdi = (smoothPlusDM[idx] / trVal) * 100;
            const mdi = (smoothMinusDM[idx] / trVal) * 100;
            plusDI.push(parseFloat(pdi.toFixed(2)));
            minusDI.push(parseFloat(mdi.toFixed(2)));
          }
        }
      }
      
      // 計算 DX = (|+DI - -DI| / (|+DI + -DI|)) * 100
      const dx = [];
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) {
          dx.push(null);
        } else {
          const pdi = plusDI[i];
          const mdi = minusDI[i];
          if (pdi + mdi === 0) {
            dx.push(0);
          } else {
            const dxVal = (Math.abs(pdi - mdi) / (pdi + mdi)) * 100;
            dx.push(parseFloat(dxVal.toFixed(2)));
          }
        }
      }
      
      // 計算 ADX (平滑 DX)
      // 初始 ADX
      let sumDX = 0;
      for (let i = period - 1; i < period * 2 - 1; i++) {
        if (dx[i] !== null) sumDX += dx[i];
      }
      const firstADX = sumDX / period;
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(null);
      adx.push(firstADX);
      
      // Wilder's 平滑 ADX
      for (let i = period * 2; i < data.length; i++) {
        const idx = i - period + 1;
        const prevADX = adx[adx.length - 1];
        const newADX = (prevADX * (period - 1) + dx[idx]) / period;
        adx.push(parseFloat(newADX.toFixed(2)));
      }
      
      return {
        plusDI: plusDI,
        minusDI: minusDI,
        adx: adx
      };
    }
    
    // 模擬 K 線數據生成
    function generateCandlestickData(days = 60) {
      const data = [];
      let basePrice = 1000 + Math.random() * 100;
      const now = new Date();
      
      for (let i = days; i >= 0; i--) {
        const date = new Date(now);
        date.setDate(date.getDate() - i);
        
        // 隨機波動
        const volatility = 0.02 + Math.random() * 0.03;
        const change = (Math.random() - 0.48) * basePrice * volatility;
        
        const open = basePrice;
        const close = basePrice + change;
        const high = Math.max(open, close) + Math.random() * basePrice * volatility * 0.5;
        const low = Math.min(open, close) - Math.random() * basePrice * volatility * 0.5;
        
        data.push({
          x: date.toISOString().split('T')[0],
          o: parseFloat(open.toFixed(2)),
          h: parseFloat(high.toFixed(2)),
          l: parseFloat(low.toFixed(2)),
          c: parseFloat(close.toFixed(2))
        });
        
        basePrice = close;
      }
      
      return data;
    }
    
    // 更新價格顯示
    function updatePriceDisplay(data) {
      const lastCandle = data[data.length - 1];
      const prevCandle = data[data.length - 2];
      
      const price = lastCandle.c;
      const change = lastCandle.c - prevCandle.c;
      const changePercent = (change / prevCandle.c) * 100;
      
      const priceEl = document.getElementById('currentPrice');
      const changeEl = document.getElementById('priceChange');
      
      priceEl.textContent = price.toLocaleString('zh-TW', { minimumFractionDigits: 2 });
      
      if (change >= 0) {
        priceEl.className = 'price up';
        changeEl.textContent = `+${change.toFixed(2)} (+${changePercent.toFixed(2)}%)`;
        changeEl.style.color = '#4ade80';
      } else {
        priceEl.className = 'price down';
        changeEl.textContent = `${change.toFixed(2)} (${changePercent.toFixed(2)}%)`;
        changeEl.style.color = '#f87171';
      }
    }
    
    // 創建主圖表 (含 K 線 + MA)
    function createChart() {
      const ctx = document.getElementById('candlestickChart').getContext('2d');
      currentData = generateCandlestickData();
      
      updatePriceDisplay(currentData);
      
      // 計算 MA
      const ma5 = calculateMA(currentData, 5);
      const ma10 = calculateMA(currentData, 10);
      const ma20 = calculateMA(currentData, 20);
      
      // 計算布林帶
      const bb = calculateBollingerBands(currentData, 20, 2);
      
      if (chart) {
        chart.destroy();
      }
      
      chart = new Chart(ctx, {
        type: 'candlestick',
        data: {
          datasets: [
            {
              label: '2330 台積電',
              data: currentData,
              color: {
                up: '#4ade80',
                down: '#f87171',
                unchanged: '#9ca3af'
              },
              borderColor: {
                up: '#4ade80',
                down: '#f87171',
                unchanged: '#9ca3af'
              }
            },
            {
              label: 'MA5',
              data: currentData.map((d, i) => ma5[i] ? { x: d.x, y: ma5[i] } : null),
              type: 'line',
              borderColor: '#FF6B6B',
              backgroundColor: '#FF6B6B',
              borderWidth: 2,
              pointRadius: 0,
              tension: 0,
              fill: false
            },
            {
              label: 'MA10',
              data: currentData.map((d, i) => ma10[i] ? { x: d.x, y: ma10[i] } : null),
              type: 'line',
              borderColor: '#4ECDC4',
              backgroundColor: '#4ECDC4',
              borderWidth: 2,
              pointRadius: 0,
              tension: 0,
              fill: false
            },
            {

    // 匯出圖表為 PNG
    function exportChartToPNG() {
      const canvas = document.getElementById('candlestickChart');
      if (!canvas) {
        alert('找不到圖表');
        return;
      }
      
      // 建立一個臨時 canvas 來組合所有圖表
      const charts = [
        { canvas: document.getElementById('candlestickChart'), height: 400, title: 'K線圖' },
        { canvas: document.getElementById('kdChart'), height: 180, title: 'KD 指標' },
        { canvas: document.getElementById('macdChart'), height: 150, title: 'MACD' },
        { canvas: document.getElementById('rsiChart'), height: 150, title: 'RSI' },
        { canvas: document.getElementById('wrChart'), height: 150, title: 'Williams %R' }
      ].filter(c => c.canvas);
      
      if (charts.length === 0) {
        alert('找不到圖表');
        return;
      }
      
      // 計算總高度
      const titleHeight = 40;
      const padding = 20;
      const totalHeight = charts.reduce((sum, c) => sum + c.height, 0) + titleHeight + padding * (charts.length + 1);
      const width = 1200;
      
      // 建立輸出 canvas
      const outputCanvas = document.createElement('canvas');
      outputCanvas.width = width;
      outputCanvas.height = totalHeight;
      const ctx = outputCanvas.getContext('2d');
      
      // 填充背景
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, width, totalHeight);
      
      // 繪製標題
      const stockName = document.getElementById('stockName').textContent;
      const currentPrice = document.getElementById('currentPrice').textContent;
      const priceChange = document.getElementById('priceChange').textContent;
      
      ctx.fillStyle = '#00d9ff';
      ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(`📈 ${stockName}`, 20, 35);
      
      ctx.fillStyle = '#fff';
      ctx.font = '20px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(currentPrice + ' ' + priceChange, 20, 60);
      
      let yOffset = titleHeight + padding;
      
      // 繪製每個圖表
      charts.forEach(chartInfo => {
        // 繪製圖表標題
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(chartInfo.title, 20, yOffset + 15);
        
        // 繪製圖表圖像
        const sourceCanvas = chartInfo.canvas;
        const destY = yOffset + 25;
        const scale = (width - 40) / sourceCanvas.width;
        const destWidth = sourceCanvas.width * scale;
        const destHeight = chartInfo.height - 40;
        
        ctx.drawImage(sourceCanvas, 20, destY, destWidth, destHeight);
        
        yOffset += chartInfo.height + padding;
      });
      
      // 產生下載
      const link = document.createElement('a');
      link.download = `kline_${stockName.replace(/[^\w]/g, '_')}_${new Date().toISOString().slice(0, 10)}.png`;
      link.href = outputCanvas.toDataURL('image/png');
      link.click();
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      createChart();
      
      // 每5秒自動更新收盤價
      setInterval(() => {
        if (chart && chart.data.datasets[0].data.length > 0) {
          const data = chart.data.datasets[0].data;
          const lastCandle = data[data.length - 1];
          
          // 模擬價格變動
          const change = (Math.random() - 0.5) * 5;
          lastCandle.c += change;
          if (lastCandle.h < lastCandle.c) lastCandle.h = lastCandle.c;
          if (lastCandle.l > lastCandle.c) lastCandle.l = lastCandle.c;
          
          currentData[currentData.length - 1] = lastCandle;
          
          // 更新 MA
          const ma5 = calculateMA(currentData, 5);
          const ma10 = calculateMA(currentData, 10);
          const ma20 = calculateMA(currentData, 20);
          
          chart.data.datasets[1].data = currentData.map((d, i) => ma5[i] ? { x: d.x, y: ma5[i] } : null);
          chart.data.datasets[2].data = currentData.map((d, i) => ma10[i] ? { x: d.x, y: ma10[i] } : null);
          chart.data.datasets[3].data = currentData.map((d, i) => ma20[i] ? { x: d.x, y: ma20[i] } : null);
          
          // 更新布林帶
          const bb = calculateBollingerBands(currentData, 20, 2);
          chart.data.datasets[4].data = currentData.map((d, i) => bb.upper[i] !== null ? { x: d.x, y: bb.upper[i] } : null);
          chart.data.datasets[5].data = currentData.map((d, i) => bb.lower[i] !== null ? { x: d.x, y: bb.lower[i] } : null);
          
          updatePriceDisplay(data);
          chart.update();
          
          // 更新 KD
          const kd = calculateKD(currentData);
          kdChart.data.datasets[0].data = currentData.map((d, i) => kd.k[i] !== null ? { x: d.x, y: kd.k[i] } : null);
          kdChart.data.datasets[1].data = currentData.map((d, i) => kd.d[i] !== null ? { x: d.x, y: kd.d[i] } : null);
          kdChart.update();

          // 更新 RSI
          const rsi = calculateRSI(currentData, 14);
          rsiChart.data.datasets[0].data = currentData.map((d, i) => rsi[i] !== null ? { x: d.x, y: rsi[i] } : null);
          rsiChart.update();

          // 更新 MACD
          const macd = calculateMACD(currentData);
          macdChart.data.datasets[0].data = currentData.map((d, i) => macd.macd[i] !== null ? { x: d.x, y: macd.macd[i] } : null);
          macdChart.data.datasets[0].backgroundColor = macd.macd.map(v => v >= 0 ? 'rgba(74, 222, 128, 0.7)' : 'rgba(248, 113, 113, 0.7)');
          macdChart.data.datasets[0].borderColor = macd.macd.map(v => v >= 0 ? '#4ade80' : '#f87171');
          macdChart.data.datasets[1].data = currentData.map((d, i) => macd.dif[i] !== null ? { x: d.x, y: macd.dif[i] } : null);
          macdChart.data.datasets[2].data = currentData.map((d, i) => macd.dea[i] !== null ? { x: d.x, y: macd.dea[i] } : null);
          macdChart.update();
          
          // 更新 Williams %R
          const wr = calculateWilliamsR(currentData, 14);
          wrChart.data.datasets[0].data = currentData.map((d, i) => wr[i] !== null ? { x: d.x, y: wr[i] } : null);
          wrChart.update();
          
          // 更新 DMI
          const dmi = calculateDMI(currentData, 14);
          dmiChart.data.datasets[0].data = currentData.map((d, i) => dmi.plusDI[i] !== null ? { x: d.x, y: dmi.plusDI[i] } : null);
          dmiChart.data.datasets[1].data = currentData.map((d, i) => dmi.minusDI[i] !== null ? { x: d.x, y: dmi.minusDI[i] } : null);
          dmiChart.data.datasets[2].data = currentData.map((d, i) => dmi.adx[i] !== null ? { x: d.x, y: dmi.adx[i] } : null);
          dmiChart.update();
        }
      }, 5000);
    });
  </script>
</body>
</html>
